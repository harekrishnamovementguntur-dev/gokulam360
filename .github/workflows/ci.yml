name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run focused canonical backup tests
        run: yarn test:backup

      - name: Build application
        run: yarn build
        env:
          JWT_SECRET: ci-only-build-secret
          MONGO_URL: mongodb://127.0.0.1:27017/gokulam360_ci
          DB_NAME: gokulam360_ci
